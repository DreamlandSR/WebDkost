apiVersion: apps/v1
kind: Deployment
metadata:
  name: webdkost-app
  namespace: webdkost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webdkost-app
  template:
    metadata:
      labels:
        app: webdkost-app
    spec:
      containers:
        - name: webdkost-app
          image: ryanzputra/webdkost:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: APP_NAME
              value: "WebDkost"
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: "http://103.157.27.229:30080"
            - name: ASSET_URL
              value: "http://103.157.27.229:30080"

            - name: APP_KEY
              value: "base64:jO9BkXabhr0rBvNoEiy5GqOjNm3cyZ6uc0qGbF9Kqzg="

            - name: CACHE_STORE
              value: "file"
            - name: CACHE_DRIVER
              value: "file"

            - name: SESSION_DRIVER
              value: "file"
            - name: SESSION_DOMAIN
              value: ""
            - name: SESSION_SECURE_COOKIE
              value: "false"

            - name: DB_CONNECTION
              value: "mysql"
            - name: DB_HOST
              value: "mysql-service"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "webdkost"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              value: "root"

            - name: MAIL_MAILER
              value: "smtp"
            - name: MAIL_HOST
              value: "smtp.gmail.com"
            - name: MAIL_PORT
              value: "587"
